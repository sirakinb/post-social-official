# Uptime, the second opinion: check that the website, the API and the publishing worker
# answer on prod. A failed run is the alert: GitHub emails the repository owner about failed
# scheduled runs. Addresses live in repository variables (Settings → Variables).
#
# The main uptime check runs in AWS every minute (infra/aws/lib/uptime-stack.ts) and emails
# through the alerts topic. This one stays because it asks from outside AWS: GitHub runs it
# only a few times a day, whatever the schedule below says (seen 2026-11-27), but it would
# still notice if the whole AWS region, the check included, went quiet.
#
# The worker has no address of its own on AWS. It writes a heartbeat to the database every
# half minute while its job loop is alive, and the API reports it: UPTIME_WORKER_URL is the
# API's /readyz/worker (https://api.postsocial.xyz/readyz/worker), used exactly as written.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Website
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 20 -o /dev/null "$SITE_URL/"
        env:
          SITE_URL: ${{ vars.UPTIME_SITE_URL }}
      - name: API (through the website to the api function)
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 20 -o /dev/null "$SITE_URL/api/v1/openapi.json"
        env:
          SITE_URL: ${{ vars.UPTIME_SITE_URL }}
      - name: Publishing worker (unhealthy if it has shown no sign of life for 5 minutes)
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 20 "$WORKER_URL" | grep -q '"ok":true'
        env:
          WORKER_URL: ${{ vars.UPTIME_WORKER_URL }}
