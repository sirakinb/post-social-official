name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Placeholders so the Convex-era build compiles; CI never calls a backend.
          NEXT_PUBLIC_CONVEX_URL: https://ci.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://ci.convex.site
          CONVEX_SITE_URL: https://ci.convex.site
