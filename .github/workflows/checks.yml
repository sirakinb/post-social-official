name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci && npm run typecheck
        working-directory: ops/convex-forwarder
      - run: npm ci && npm run typecheck && npm test && npm run synth
        working-directory: infra/aws
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The move to AWS: build a Postgres 15 the way the AWS database is set up (every
      # migration, no InsForge), run the backend's tests on it, and build the API's image.
      - name: Backend on plain Postgres
        run: scripts/local-database.sh && npm run test:pg
      - name: API container image builds
        run: docker build -q -t postsocial-api:ci backend
