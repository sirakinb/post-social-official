name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Placeholders so the Convex-era build compiles; CI never calls a backend.
          NEXT_PUBLIC_CONVEX_URL: https://ci.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://ci.convex.site
          CONVEX_SITE_URL: https://ci.convex.site
