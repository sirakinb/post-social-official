# A backup of the prod database, started by hand.
#
# The nightly backup itself is started by AWS, not from here (infra/aws/lib/backup-stack.ts):
# a task inside our network dumps the database, checks the dump holds real data, and uploads
# it to s3://postsocial-backups-039612844713/daily/ (kept 30 days) and, on the 1st of the
# month, to monthly/ (kept 12 months). The database accepts no connection from outside the
# network, so a GitHub runner could not dump it. A nightly run that fails sends a message to
# the alerts topic in AWS.
#
# It used to be scheduled here. GitHub runs this repository's schedules a few times a day at
# best, so the schedule moved to AWS on 2026-11-27. This workflow stays for a run by hand:
# Actions tab, "Back up prod database", Run workflow. Tick "monthly" to also save the
# monthly copy.
#
# No stored AWS keys: the job signs in as the role below through GitHub's own identity. That
# role trusts only main, and can start this one task and watch it. The task's own role is
# what adds the file to the bucket.
# Restore steps: docs/environments.md, "Nightly backups to S3".
name: Back up prod database

on:
  workflow_dispatch:
    inputs:
      monthly:
        description: Also save this run as the monthly copy
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # lets the job sign in to AWS without stored keys

concurrency:
  group: prod-backup
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::039612844713:role/postsocial-github-backup

jobs:
  backup:
    # The AWS role only trusts main of this repository. No `environment:` here: it would
    # change the identity GitHub signs the job with, and the role would refuse it.
    if: github.repository == 'sirakinb/post-social-official' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: prod-backup-${{ github.run_id }}

      # Starts the task inside the network and waits for it. Prints ids and states only.
      - name: Back up prod
        run: |
          set -euo pipefail
          if [[ "$MONTHLY" == "true" ]]; then node scripts/aws-backup.mjs prod --monthly; else node scripts/aws-backup.mjs prod; fi
        env:
          MONTHLY: ${{ inputs.monthly }}
