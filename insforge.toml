# InsForge project settings, applied to dev with `npm run config:dev` and to prod by
# `npm run db:promote`. Sign-up is open (email and Google): that takes disable_signup =
# false here AND PUBLIC_SIGNUP=on on the website. Redirect URLs are where Google sign-in
# may return to (src/app/beta/auth/callback).
[auth]
allowed_redirect_urls = [
  "https://www.postsocial.xyz/beta/auth/callback",
  "https://postsocial.xyz/beta/auth/callback",
  "http://localhost:3333/beta/auth/callback",
]
require_email_verification = false
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 12
require_number = true
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
